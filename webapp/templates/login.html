<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluador 3280 · DUSAKAWI EPSI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: #F0F2F7;
}
.card {
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 8px 40px rgba(80,60,180,.13), 0 2px 8px rgba(0,0,0,.06);
  padding: 44px 40px 40px;
  width: 100%; max-width: 400px;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.logo-wrap {
  width: 76px; height: 76px; border-radius: 22px;
  background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin-bottom: 22px;
  box-shadow: 0 6px 20px rgba(124,58,237,.35);
  position: relative;
}
.logo-check {
  position: absolute; top: -6px; right: -6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #22C55E; border: 2.5px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff; font-weight: 700;
}
.app-title { font-size: 22px; font-weight: 800; color: #1A1A2E; margin-bottom: 4px; }
.app-sub { font-size: 13px; color: #6B7280; margin-bottom: 32px; }
.form-group { width: 100%; display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-label { font-size: 11px; font-weight: 700; color: #374151; letter-spacing: .6px; text-transform: uppercase; }
.input-wrap { position: relative; }
.input-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  font-size: 15px; opacity: .45; pointer-events: none;
}
.form-control {
  width: 100%; padding: 11px 13px 11px 38px;
  border: 1.5px solid #E5E7EB; border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 14px; color: #111827;
  outline: none; transition: border-color .15s, box-shadow .15s;
  background: #F9FAFB;
}
.form-control:focus { border-color: #6D28D9; box-shadow: 0 0 0 3px rgba(109,40,217,.12); background: #fff; }
.eye-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 16px; opacity: .4; padding: 2px;
}
.eye-btn:hover { opacity: .75; }
.alert-error {
  width: 100%; background: #FEF2F2; border: 1px solid #FECACA;
  color: #DC2626; font-size: 13px; padding: 10px 14px;
  border-radius: 9px; margin-bottom: 10px; text-align: center;
}
.btn-login {
  width: 100%; padding: 13px; margin-top: 6px;
  background: linear-gradient(135deg, #6D28D9 0%, #4F46E5 100%);
  color: #fff; border: none; border-radius: 10px;
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: opacity .15s, transform .1s;
  letter-spacing: .2px;
}
.btn-login:hover { opacity: .9; }
.btn-login:active { transform: scale(.98); }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.version { font-size: 11px; color: #9CA3AF; margin-top: 22px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2.5px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: -2px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    📊
    <div class="logo-check">✓</div>
  </div>
  <div class="app-title">Evaluador 3280</div>
  <div class="app-sub">Inicia sesión para continuar</div>

  {% if error %}
  <div class="alert-error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login" style="width:100%" onsubmit="onSubmit(event)">
    <div class="form-group">
      <label class="form-label">Usuario</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input name="username" class="form-control" placeholder="nombre de usuario" required autocomplete="username">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input id="pwd" name="password" type="password" class="form-control" placeholder="contraseña" required autocomplete="current-password">
        <button type="button" class="eye-btn" onclick="togglePwd()" id="eye-btn">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-login" id="btn-login">Ingresar</button>
  </form>
  <div class="version">v0.1 · DUSAKAWI EPSI · Res. 3280</div>
</div>
<script>
function togglePwd() {
  const p = document.getElementById("pwd");
  p.type = p.type === "password" ? "text" : "password";
}
function onSubmit(e) {
  const btn = document.getElementById("btn-login");
  btn.innerHTML = '<span class="spin"></span> Ingresando...';
  btn.disabled = true;
}
</script>
</body>
</html>
